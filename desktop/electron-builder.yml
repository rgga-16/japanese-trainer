appId: com.rgeegallega.jlptn4trainer
productName: JLPT N4 Trainer
directories:
  output: release
  buildResources: build
files:
  - main.cjs
  - app/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JLPT N4 Trainer
  artifactName: JLPT-N4-Trainer-Setup-${version}.exe
publish: null
